name: Commit Changelogs
concurrency: commit_changelog

on:
  push:
    branches: [master]
    paths-ignore:
      - 'Resources/Changelog/**'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: |
          cd "Tools/_NF/changelog"
          npm ci
        shell: bash

      - name: Generate Changelog
        run: |
          cd "Tools/_NF/changelog"
          node commit_changelog.js
        shell: bash
        env:
          CHANGELOG_DIR: Resources/Changelog/Palmtree.yml

      - name: Commit Changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Changelog/Palmtree.yml
          git commit -m "Update Palmtree changelog" || exit 0
          git pull --rebase origin master
          git push
        shell: bash
        continue-on-error: true
