- type: species
  id: Synth
  name: species-name-synth
  roundStart: true
  prototype: MobSynth
  sprites: MobSynthSprites
  markingLimits: MobSynthMarkingLimits
  dollPrototype: MobSynthDummy
  skinColoration: Hues
  kind:
  - BasicHumanlike
  - BasicFurry
  - BasicRobot
  - VoxLike
  sexes:
  - Male
  - Female
  - Unsexed

# Synths use the human base body as a canvas; players reshape it with the ported
# species-adaptor and marking systems.
- type: speciesBaseSprites
  id: MobSynthSprites
  sprites:
