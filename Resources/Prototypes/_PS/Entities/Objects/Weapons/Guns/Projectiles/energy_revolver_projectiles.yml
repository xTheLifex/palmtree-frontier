# Palmtree: magnum bolt for the EG-4 energy revolver, ported from Coyote (Goobstation).
# Original: Resources/Prototypes/Goobstation/Entities/Objects/Weapons/Guns/Projectiles/projectiles.yml (Coyote)

- type: entity
  name: magnum bolt
  id: BulletEnergyGunMagnum
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      shader: unshaded
  - type: Ammo
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Projectile
    impactEffect: BulletImpactEffectRedDisabler
    damage:
      types:
        Blunt: 3
        Heat: 19
    soundHit:
      collection: MeatLaserImpact
