- type: species
  id: SlimePerson
  name: species-name-slime
  roundStart: true
  prototype: MobSlimePerson
  sprites: MobSlimeSprites
  defaultSkinTone: "#b8b8b8"
  markingLimits: MobSlimeMarkingLimits
  dollPrototype: MobSlimePersonDummy
  kind:
  - BasicHumanlike
  skinColoration: Hues

- type: speciesBaseSprites
  id: MobSlimeSprites
  sprites:
    Genital: MobHumanoidAnyMarking
    GenitalUnder: MobHumanoidAnyMarking
    GenitalLow: MobHumanoidAnyMarking
    Special: MobHumanoidAnyMarking # Palmtree: cat ears and other special markings must render
    Tail: MobHumanoidAnyMarking # Palmtree: tails (the layer existed only as TailBehind/TailOversuit)
    TailBehind: MobHumanoidAnyMarking
    Head: MobSlimeHead
    Hair: MobSlimeMarkingFollowSkin
    FacialHair: MobSlimeMarkingFollowSkin
    Snout: MobHumanoidAnyMarking # Palmtree: snouts/muzzles
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobSlimeTorso
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking # Palmtree: ears and head-top markings
    HeadSide: MobHumanoidAnyMarking # Palmtree: side horns/frills
    LArm: MobSlimeLArm
    RArm: MobSlimeRArm
    LHand: MobSlimeLHand
    RHand: MobSlimeRHand
    LLeg: MobSlimeLLeg
    RLeg: MobSlimeRLeg
    LFoot: MobSlimeLFoot
    RFoot: MobSlimeRFoot
    TailOversuit: MobHumanoidAnyMarking
    NeckFluff: MobHumanoidAnyMarking # Palmtree: Ovinia neck fluff
    RArmExtension: MobHumanoidAnyMarking # Palmtree: harpy wings
    UndershirtUnderclothes: MobHumanoidAnyMarking
    UndershirtOverclothes: MobHumanoidAnyMarking

- type: markingPoints
  id: MobSlimeMarkingLimits
  points:
