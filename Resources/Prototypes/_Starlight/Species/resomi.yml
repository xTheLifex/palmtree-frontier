- type: species
  id: Resomi
  name: species-name-resomi
  roundStart: true
  prototype: MobResomi
  sprites: MobResomiSprites
  defaultSkinTone: "#faf7f7"
  markingLimits: MobResomiMarkingLimits
  maleFirstNames: names_resomi_first
  femaleFirstNames: names_resomi_first
  lastNames: names_resomi_packs
  naming: FirstLast
  dollPrototype: MobResomiDummy
  skinColoration: Hues
  minAge: 23
  youngAge: 103
  oldAge: 257
  maxAge: 430
  # Palmtree: height/width fields are not supported by SpeciesPrototype here and were dropped.
  # Coyote: Add kind for markings
  kind:
    - BasicHumanlike
    - BasicFurry
  # End Coyote

- type: speciesBaseSprites
  id: MobResomiSprites
  sprites:
    Head: MobResomiHead
    HeadTop: MobHumanoidAnyMarking
