    Tail: MobHumanoidAnyMarking
    Eyes: MobAvaliEyes
    LArm: MobAvaliLArm
    RArm: MobAvaliRArm
    LHand: MobAvaliLHand
    RHand: MobAvaliRHand
    LLeg: MobAvaliLLeg
