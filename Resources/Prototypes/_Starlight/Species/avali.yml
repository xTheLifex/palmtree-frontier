- type: species
  id: Avali
  name: species-name-avali
  roundStart: true
  prototype: MobAvali
  sprites: MobAvaliSprites
  defaultSkinTone: "#D2B48C"
  markingLimits: MobAvaliMarkingLimits
  dollPrototype: MobAvaliDummy
  skinColoration: Hues
  maleFirstNames: names_avali_first
  femaleFirstNames: names_avali_first
  lastNames: names_avali_packs
  naming: FirstLast
  minAge: 23
  youngAge: 103
  oldAge: 257
  # Palmtree: height/width fields are not supported by SpeciesPrototype here and were dropped.
  # Coyote: Add kind for markings
  kind:
    - BasicHumanlike
    - BasicFurry
  # End Coyote

