# Palmtree: chamber bases for the Fallout gun port. Generated by gen_guns.py.


- type: entity
  id: CSBaseWeaponPistolChamber9mm
  parent: NFBaseWeaponPistolChamber
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-caliber-9mm
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CSMagazine9mm
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - CSMagazine9mm
          - CSMagazine9mmDs
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CSCartridge9mm
        priority: 1
        whitelist:
          tags:
          - CSCartridge9mm


