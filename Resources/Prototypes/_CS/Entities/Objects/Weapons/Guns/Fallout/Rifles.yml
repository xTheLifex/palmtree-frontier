# Palmtree: Rifles ported from coyote-bayou. Generated by gen_guns.py.


- type: entity
  id: CSWeaponRifleM1Garand
  parent: [ CSBaseWeaponRifleChamber3006, NFBaseWeaponFrameRifle ]
  name: M1Garand
  description: The WWII American classic. Still has that satisfying ping.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/M1Garand.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/M1Garand.rsi
  - type: ChamberMagazineAmmoProvider
    autoEject: true
    autoEjectDeferChambered: true # Palmtree: clip ejects and pings only after the last shot
    soundAutoEject:
      path: /Audio/_CS/Weapons/Fallout/garand_ping.ogg
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/hunting_rifle.ogg
  - type: StaticPrice
    price: 3200


