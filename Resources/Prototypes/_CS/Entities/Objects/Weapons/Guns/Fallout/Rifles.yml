- type: entity
  id: CSWeaponRifleAUGA10
  parent: [ CSBaseWeaponRifleChamber5mm, NFBaseWeaponFrameRifleAssault ]
  name: AUGA10
  description: An AUG A10 assault rifle, manufactured by Steyr in the 2100s. This rifle saw extensive usage by the Pre-Fall Austrian forces. Comes with a built in scope. Chambered in 5mm.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/AUGA10.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/AUGA10.rsi
  - type: Gun
    fireRate: 3.34
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/aug.ogg
  - type: ChamberMagazineAmmoProvider # Palmtree: CSS sound set
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/aug_boltpull.ogg
  - type: ItemSlots # Palmtree: CSS sound set - must mirror CSBaseWeaponRifleChamber5mm
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CSMagazine5mm
        insertSound: /Audio/Weapons/Guns/MagIn/aug_clipin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/aug_clipout.ogg
        priority: 2
        whitelist:
          tags:
          - CSMagazine5mm
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CSCartridge5mm
        priority: 1
        whitelist:
          tags:
          - CSCartridge5mm
  - type: GunDamageMultiplier # Palmtree: 1.25x damage
    multiplier: 1.25
  - type: StaticPrice
    price: 4200


