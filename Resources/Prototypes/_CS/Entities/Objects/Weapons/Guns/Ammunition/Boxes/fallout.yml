# Palmtree: Fallout ammo boxes ported from coyote-bayou. Generated by gen_ammo.py.


- type: entity
  id: CSBaseAmmunitionBox9mm
  name: ammunition box (9mm)
  parent: NFBaseAmmunitionBox
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CSCartridge9mm
    proto: CSCartridge9mm
    capacity: 60
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Ammunition/Boxes/9mm.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false


- type: entity
  id: CSAmmunitionBox9mm
  name: ammunition box (9mm)
  parent: CSBaseAmmunitionBox9mm
  components:
  - type: BallisticAmmoProvider
    proto: CSCartridge9mm
  - type: Sprite
    layers:
    - state: base
      color: "#666666"
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]


