- type: entity
  id: CSWeaponAssaultRifleAKM
  parent: [ NFBaseWeaponRifleAssaultChamber30, NFBaseWeaponFrameRifleAssaultCybersun ]
  name: AKM
  description: An old AKM, or is it brand new? It's hard to tell these days.
  components:
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Rifles/akm.rsi
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Rifles/akm.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Gun
    angleIncrease: 0.9
    angleDecay: 3.6
    fireRate: 6.4
    soundGunshot:
      path: /Audio/_PS/Weapons/Guns/Gunshots/ak47.ogg
  - type: ChamberMagazineAmmoProvider # Palmtree: CSS sound set
    soundRack:
      path: /Audio/_PS/Weapons/Guns/Bolt/ak47_boltpull.ogg
    soundBoltOpened:
      path: /Audio/_PS/Weapons/Guns/Bolt/ak47_boltpull.ogg
    soundBoltClosed:
      path: /Audio/_PS/Weapons/Guns/Bolt/ak47_boltpull.ogg
  - type: ItemSlots # Palmtree: CSS sound set - must mirror NFBaseWeaponRifleAssaultChamber30
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NFMagazineRifle30
        insertSound: /Audio/_PS/Weapons/Guns/MagIn/ak47_clipin.ogg
        ejectSound: /Audio/_PS/Weapons/Guns/MagOut/ak47_clipout.ogg
        priority: 2
        whitelist:
          tags:
          - NFMagazineRifle30
          - NFMagazineLowCapacityRifle30
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgeRifle30
        priority: 1
        whitelist:
          tags:
          - NFCartridgeRifle30
  - type: GunDamageMultiplier # Palmtree: 1.25x damage
    multiplier: 1.25
